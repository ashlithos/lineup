<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lineup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Lineup's Sol "cool · Lilac" tokens (app/globals.css). Follows the host
     theme. No color-scheme: it makes the iframe paint an opaque canvas. */
  :root {
    --paper: #f4f6f8; --raised: #ffffff; --ink: #21242c; --ink-soft: #5c636f; --line: #e4e7ec; --line-strong: #d3d7df;
    --accent: #6e5ec8; --accent-soft: #f1effe; --accent-strong: #6051ab;
    --urgent: #cf2a24; --urgent-soft: #fceae8; --soon: #9b6109; --soon-soft: #faf0dc; --ok: #087d4a; --ok-soft: #e4f7ec;
    --d1: rgba(110, 94, 200, 0.14); --d2: rgba(110, 94, 200, 0.32);
  }
  :root[data-theme="dark"] {
    --paper: #1c1e24; --raised: #262931; --ink: #eceef2; --ink-soft: #a3a9b4; --line: #343844; --line-strong: #434856;
    --accent: #8b7ee0; --accent-soft: #2c2843; --accent-strong: #b9afff;
    --urgent: #ff7a73; --urgent-soft: #3a2224; --soon: #e3b25e; --soon-soft: #3a3020; --ok: #5fd39c; --ok-soft: #1f3a2d;
    --d1: rgba(139, 126, 224, 0.22); --d2: rgba(139, 126, 224, 0.45);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body { font-family: Figtree, -apple-system, system-ui, sans-serif; color: var(--ink); font-size: 14px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mono { font-family: "DM Mono", ui-monospace, monospace; }
  .muted { color: var(--ink-soft); }
  .small { font-size: 12px; }
  .pad { margin: 4px; }
  .widget { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 2px 4px; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--accent); flex-shrink: 0; }
  .hero { border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); background: var(--accent-soft); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .eyebrow { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-strong); }
  .eyebrow .dot { width: 6px; height: 6px; }
  .hero-title { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .hero-title h2 { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.2; }
  .big { margin: 6px 0 0; font-size: 28px; font-weight: 500; line-height: 1.1; color: var(--accent-strong); }
  .hero.urgent .big { color: var(--urgent); }
  .sub { margin: 0; font-size: 13px; line-height: 1.45; color: var(--accent-strong); }
  .btns { display: flex; gap: 8px; margin-top: 8px; }
  .btn { flex: 1; min-height: 44px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--raised); font-size: 14px; font-weight: 600; }
  .btn.accent { background: var(--accent); border-color: transparent; color: #fff; }
  .btn.danger { color: var(--urgent); border-color: color-mix(in srgb, var(--urgent) 40%, transparent); }
  .btn.ink { background: var(--ink); color: var(--paper); border-color: transparent; }
  .note, .confirm { margin-top: 8px; background: var(--raised); border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.45; }
  .note { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .note.ok { color: var(--ok); }
  .link { min-height: 36px; border: 0; background: transparent; color: var(--accent-strong); font-weight: 600; padding: 0 6px; }
  .link.light { color: #c9c1ff; }
  .list { background: var(--raised); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .tile { width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: var(--paper); display: grid; place-items: center; font-size: 17px; }
  .grow { flex: 1; min-width: 0; }
  .title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { margin-top: 2px; font-size: 12.5px; color: var(--ink-soft); }
  .chips { display: flex; flex-direction: column; gap: 4px; }
  .chip { min-height: 32px; min-width: 64px; border-radius: 999px; border: 1px solid var(--line); background: var(--raised); color: var(--ink-soft); font-size: 12px; font-weight: 600; padding: 0 10px; }
  .chip.on { background: var(--ok-soft); color: var(--ok); }
  .tone-urgent { color: var(--urgent); } .tone-soon { color: var(--soon); } .tone-calm, .tone-ok { color: var(--ok); }
  .tone-tobook { color: var(--soon); } .tone-locked, .tone-passed { color: var(--ink-soft); }
  .day { width: 64px; flex-shrink: 0; font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .tag { font-size: 11.5px; font-weight: 600; flex-shrink: 0; text-align: right; max-width: 96px; }
  .tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; border: 1px solid var(--line); background: var(--raised); border-radius: 999px; padding: 2px; }
  .tab { min-height: 36px; border: 0; border-radius: 999px; background: transparent; color: var(--ink-soft); font-size: 13px; font-weight: 600; }
  .tab.on { background: var(--accent); color: #fff; }
  .tab:disabled { opacity: 0.4; cursor: default; }
  .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .card { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 10px 11px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .card-title { font-size: 14px; font-weight: 600; line-height: 1.25; }
  .card .tag { text-align: left; max-width: none; }
  .tt { background: var(--raised); border: 1px solid var(--line); border-radius: 16px; padding: 10px 8px 12px; display: flex; flex-direction: column; gap: 8px; }
  .tt-scroll { overflow-x: auto; }
  .tt-grid { display: flex; min-width: min-content; }
  .gutter { position: relative; width: 30px; flex-shrink: 0; margin-top: 40px; }
  .hour { position: absolute; left: 0; right: 0; font-size: 10px; color: var(--ink-soft); transform: translateY(-6px); }
  .col { width: 66px; flex-shrink: 0; border-left: 1px solid var(--line); }
  .col-head { height: 40px; padding: 2px 4px; font-size: 11px; text-align: center; display: flex; flex-direction: column; overflow: hidden; }
  .place { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col-body { position: relative; }
  .block { position: absolute; left: 2px; right: 2px; border-radius: 7px; padding: 3px 4px; font-size: 10px; line-height: 1.2; overflow: hidden; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); color: var(--accent-strong); display: flex; flex-direction: column; }
  .block.short { flex-direction: row; gap: 4px; white-space: nowrap; }
  .block.short b { overflow: hidden; text-overflow: ellipsis; }
  .block.short span { display: none; }
  .block.k-tobook { background: var(--soon-soft); border: 1px dashed var(--soon); color: var(--soon); }
  .block.k-buffer, .block.k-transit { background: var(--paper); border-style: dashed; border-color: var(--line-strong); color: var(--ink-soft); }
  .legend { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--ink-soft); padding-left: 30px; }
  .sw { width: 10px; height: 10px; border-radius: 3px; margin-left: 8px; }
  .sw.booked { background: var(--accent-soft); border: 1px solid var(--accent); }
  .sw.tobook { border: 1px dashed var(--soon); }
  .year { background: var(--raised); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .yr { display: grid; gap: 4px; align-items: center; font-size: 12px; }
  .head-row { font-size: 10px; color: var(--ink-soft); text-align: center; }
  .cell { height: 26px; border-radius: 6px; display: grid; place-items: center; font-family: "DM Mono", monospace; font-size: 11px; }
  .d0 { background: var(--paper); } .d1 { background: var(--d1); } .d2 { background: var(--d2); } .d3 { background: var(--accent); color: #fff; }
  .toast { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: #21242c; color: #fff; border-radius: 12px; padding: 8px 8px 8px 12px; font-size: 13px; }
</style>
</head>
<body>
<div id="root"></div>
<!-- SCRIPT -->
</body>
</html>
